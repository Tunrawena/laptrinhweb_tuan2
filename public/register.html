<!DOCTYPE html>
<html>
<head>
    <title>Lập trình web - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="browser-mockup">
        <div class="header-bar">
            <span>Lập trình web</span>
            <div class="address-bar">http://php.local</div>
        </div>
        <div class="nav-menu">Home | Đăng nhập | <b>Đăng ký</b></div>
        <div class="content">
            <div class="form-container">
                <h2>Màn hình đăng ký</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password">
                </div>
                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email">
                </div>
                <div class="links-bottom">
                    <a href="login.html" style="color: skyblue; text-decoration: none;">Đã có tài khoản</a>
                    <button class="btn-blue">Đăng ký</button>
                </div>
            </div>
        </div>
        <div class="footer">Lập trình web @01/2024</div>
    </div>
</body>
</html>
