<!DOCTYPE html>
<html>
<head>
    <title>Lập trình web - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="browser-mockup">
        <div class="header-bar">
            <span>Lập trình web</span>
            <div class="address-bar">http://php.local</div>
        </div>
        <div class="nav-menu">Home | <b>Đăng nhập</b> | Đăng ký</div>
        <div class="content">
            <div class="form-container">
                <h2>Màn hình đăng nhập</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password">
                </div>
                <div>
                    <input type="checkbox"> Ghi nhớ đăng nhập
                </div>
                <div class="links-bottom">
                    <a href="#" style="color: skyblue; text-decoration: none;">Quên mật khẩu</a>
                    <button class="btn-blue">Đăng nhập</button>
                </div>
            </div>
        </div>
        <div class="footer">Lập trình web @01/2024</div>
    </div>
</body>
</html>
